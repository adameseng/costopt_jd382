[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adameseng-costopt_jd382"
version = "0.1.0"
description = "解析时间标记，排列推理成本优化顾问·投机解码的命中率的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "adameseng" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://adameseng.github.io"
Repository = "https://github.com/adameseng/costopt_jd382"
Issues = "https://github.com/adameseng/costopt_jd382/issues"

[project.scripts]
costopt_jd382 = "costopt_jd382:main"

[tool.setuptools]
py-modules = ["costopt_jd382"]
